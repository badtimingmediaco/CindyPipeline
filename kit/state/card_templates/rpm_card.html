<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-print-color-adjust:exact}
body{background:transparent;font-family:'Poppins','Segoe UI',sans-serif}
.stage{width:1400px;height:900px;display:flex;align-items:center;justify-content:center}
.card{width:1080px;background:#fffdf9;border-radius:14px;padding:48px 56px 42px;
  box-shadow:0 18px 60px rgba(0,0,0,.38);border:1px solid #eee2d2}
.head{display:flex;align-items:center;gap:14px;border-bottom:3px solid #e8856a;padding-bottom:16px;margin-bottom:24px}
.head .dot{width:44px;height:44px;border-radius:12px;background:#e8856a;color:#fff;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:24px}
.head h1{font-size:38px;font-weight:800;color:#2b2724;letter-spacing:.5px}
.row{display:flex;gap:24px}
.col{flex:1;border:2px solid #eee2d2;border-radius:12px;padding:22px 26px}
.col.win{border-color:#3d8a5f;background:#f4faf6}
.col h2{font-size:28px;font-weight:800;color:#2b2724;margin-bottom:8px}
.col .rpm{font-size:52px;font-weight:800}
.win .rpm{color:#3d8a5f}.lose .rpm{color:#b8543f}
.col p{font-size:24px;color:#6f6660;margin-top:6px;line-height:1.4}
.foot{margin-top:22px;font-size:25px;color:#8a7f74}
.foot b{color:#d46a4e}
</style></head><body>
<div class="stage"><div class="card">
  <div class="head"><div class="dot">$</div><h1>THE RPM MATH</h1></div>
  <div class="row">
    <div class="col win"><h2>FINANCE</h2><div class="rpm">$20 RPM</div>
      <p>500K views/mo<br><b style="color:#3d8a5f">≈ $10K from AdSense</b></p></div>
    <div class="col lose"><h2>ENTERTAINMENT</h2><div class="rpm">$3–8 RPM</div>
      <p>same 500K views<br>≈ $1.5–4K … same effort</p></div>
  </div>
  <div class="foot">RPM = what you earn per 1,000 views → <b>the niche IS the paycheck</b></div>
</div></div>
</body></html>
